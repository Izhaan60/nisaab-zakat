    <!-- JAVASCRIPT LOGIC -->>

    <script>

        // Global State Variables
        let currentCurrency = 'USD';
        let currencySymbol = '$';

        let activeNisabStandard = 'silver'; // 'silver' or 'gold'
        let goldUnit = 'grams'; // 'grams' or 'tolas'
        let silverUnit = 'grams'; // 'grams' or 'tolas'

        const CURRENCY_SYMBOLS = {
            PKR: 'Rs. ',
            USD: '$',
            EUR: '€',
            GBP: '£',
            SAR: 'SR ',
            AED: 'AED ',
            INR: '₹',
            BDT: '৳',
            CAD: 'C$',
            AUD: 'A$'
        };

        // Initialize on Load
        window.onload = function() {
            document.getElementById('year').innerText = new Date().getFullYear();
            updateCurrency();
        };

        // Update Currency Across Interface
        function updateCurrency() {
            currentCurrency = document.getElementById('currencySelect').value;
            currencySymbol = CURRENCY_SYMBOLS[currentCurrency] || '$';

            // Update all symbol spans
            const symbols = document.querySelectorAll('.curr-symbol');
            symbols.forEach((el) => { el.innerText = currencySymbol; });

            calculateZakat();
        }

        // Toggle Nisab Standard (Silver vs Gold)
        function setNisabStandard(standard) {
            activeNisabStandard = standard;
            const btnSilver = document.getElementById('btnNisabSilver');
            const btnGold = document.getElementById('btnNisabGold');

            if (standard === 'silver') {
                btnSilver.className = "px-4 py-1.5 rounded-lg bg-emerald-800 text-white shadow-sm transition-all";
                btnGold.className = "px-4 py-1.5 rounded-lg text-slate-700 hover:text-slate-900 transition-all";
                document.getElementById('nisabTypeDisplay').innerText = 'Silver';
                document.getElementById('nisabBenchmarkText').innerText = '612.36 grams (52.5 Tolas) of Silver';
            } else {
                btnGold.className = "px-4 py-1.5 rounded-lg bg-emerald-800 text-white shadow-sm transition-all";
                btnSilver.className = "px-4 py-1.5 rounded-lg text-slate-700 hover:text-slate-900 transition-all";
                document.getElementById('nisabTypeDisplay').innerText = 'Gold';
                document.getElementById('nisabBenchmarkText').innerText = '87.48 grams (7.5 Tolas) of Pure Gold';
            }

            calculateZakat();
        }

        const GRAMS_PER_TOLA = 11.6638;

        // Keep the entered metal value unchanged when switching units.
        function convertMetalUnit(weightId, rateId, nextUnit, currentUnit) {
            if (nextUnit === currentUnit) return;

            const weightInput = document.getElementById(weightId);
            const rateInput = document.getElementById(rateId);
            const weight = parseFloat(weightInput.value);
            const rate = parseFloat(rateInput.value);

            if (Number.isFinite(weight) && weight >= 0) {
                weightInput.value = (nextUnit === 'tolas' ? weight / GRAMS_PER_TOLA : weight * GRAMS_PER_TOLA).toFixed(4);
            }
            if (Number.isFinite(rate) && rate >= 0) {
                rateInput.value = (nextUnit === 'tolas' ? rate * GRAMS_PER_TOLA : rate / GRAMS_PER_TOLA).toFixed(4);
            }
        }

        // Gold Unit Toggles
        function setGoldUnit(unit) {
            convertMetalUnit('goldWeight', 'goldRate', unit, goldUnit);
            goldUnit = unit;
            const btnGrams = document.getElementById('goldUnitGrams');
            const btnTolas = document.getElementById('goldUnitTolas');

            if (unit === 'grams') {
                btnGrams.className = "px-2.5 py-1 rounded bg-white text-slate-900 shadow-xs";
                btnTolas.className = "px-2.5 py-1 rounded text-slate-600 hover:text-slate-900";
                document.getElementById('goldUnitLabel').innerText = 'Grams';
                document.getElementById('goldRateUnitLabel').innerText = 'Gram';
            } else {
                btnTolas.className = "px-2.5 py-1 rounded bg-white text-slate-900 shadow-xs";
                btnGrams.className = "px-2.5 py-1 rounded text-slate-600 hover:text-slate-900";
                document.getElementById('goldUnitLabel').innerText = 'Tolas';
                document.getElementById('goldRateUnitLabel').innerText = 'Tola';
            }
            calculateZakat();
        }

        // Silver Unit Toggles
        function setSilverUnit(unit) {
            convertMetalUnit('silverWeight', 'silverRate', unit, silverUnit);
            silverUnit = unit;
            const btnGrams = document.getElementById('silverUnitGrams');
            const btnTolas = document.getElementById('silverUnitTolas');

            if (unit === 'grams') {
                btnGrams.className = "px-2.5 py-1 rounded bg-white text-slate-900 shadow-xs";
                btnTolas.className = "px-2.5 py-1 rounded text-slate-600 hover:text-slate-900";
                document.getElementById('silverUnitLabel').innerText = 'Grams';
                document.getElementById('silverRateUnitLabel').innerText = 'Gram';
            } else {
                btnTolas.className = "px-2.5 py-1 rounded bg-white text-slate-900 shadow-xs";
                btnGrams.className = "px-2.5 py-1 rounded text-slate-600 hover:text-slate-900";
                document.getElementById('silverUnitLabel').innerText = 'Tolas';
                document.getElementById('silverRateUnitLabel').innerText = 'Tola';
            }
            calculateZakat();
        }

        // Core Zakat Calculation Engine
        function calculateZakat() {
            // Cash inputs
            const cash = parseFloat(document.getElementById('cashInHand').value) || 0;
            const bank = parseFloat(document.getElementById('bankBalance').value) || 0;

            // Gold inputs
            const gWeight = parseFloat(document.getElementById('goldWeight').value) || 0;
            const gKaratMultiplier = parseFloat(document.getElementById('goldKarat').value) || 1.0;
            const goldRateInput = document.getElementById('goldRate');
            const gRate = goldRateInput.value.trim() === '' ? 75 : (parseFloat(goldRateInput.value) || 0);

            // Silver inputs
            const sWeight = parseFloat(document.getElementById('silverWeight').value) || 0;
            const silverRateInput = document.getElementById('silverRate');
            const sRate = silverRateInput.value.trim() === '' ? 0.9 : (parseFloat(silverRateInput.value) || 0);

            // Business & Liabilities
            const business = parseFloat(document.getElementById('businessInventory').value) || 0;
            const stocks = parseFloat(document.getElementById('investments').value) || 0;
            const liabilities = parseFloat(document.getElementById('liabilities').value) || 0;

            // Calculate Gold Total Value
            // Pure weight = weight * karat purity factor
            const pureGoldWeight = gWeight * gKaratMultiplier;
            const totalGoldVal = pureGoldWeight * gRate;
            document.getElementById('goldTotalDisplay').innerText = formatNum(totalGoldVal);

            // Calculate Silver Total Value
            const totalSilverVal = sWeight * sRate;
            document.getElementById('silverTotalDisplay').innerText = formatNum(totalSilverVal);

            // Total Gross & Net Wealth
            const grossWealth = cash + bank + totalGoldVal + totalSilverVal + business + stocks;
            const netWealth = Math.max(0, grossWealth - liabilities);

            // Calculate Nisab Threshold Value
            let nisabThreshold = 0;
            if (activeNisabStandard === 'silver') {
                // Silver Nisab = 612.36 grams or 52.5 tolas
                if (sRate > 0) {
                    nisabThreshold = (silverUnit === 'grams') ? (612.36 * sRate) : (52.5 * sRate);
                }
            } else {
                // Gold Nisab = 87.48 grams or 7.5 tolas
                if (gRate > 0) {
                    nisabThreshold = (goldUnit === 'grams') ? (87.48 * gRate) : (7.5 * gRate);
                }
            }

            // Calculate Final Zakat Payable (2.5%)
            let zakatPayable = 0;
            const badge = document.getElementById('nisabStatusBadge');

            if (nisabThreshold > 0) {
                if (netWealth >= nisabThreshold) {
                    zakatPayable = netWealth * 0.025;
                    badge.className = "mt-2 text-center py-1.5 px-3 rounded-xl text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
                    badge.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i>Eligible for Zakat (Net wealth exceeds Nisab)';
                } else {
                    zakatPayable = 0;
                    badge.className = "mt-2 text-center py-1.5 px-3 rounded-xl text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40";
                    badge.innerHTML = '<i class="fa-solid fa-circle-info mr-1"></i>Below Nisab Threshold (No Zakat due)';
                }
            } else {
                badge.className = "mt-2 text-center py-1.5 px-3 rounded-xl text-xs font-bold bg-slate-800/80 text-slate-300 border border-slate-700";
                badge.innerHTML = 'Enter metal rate to check eligibility';
                if (netWealth > 0) {
                    zakatPayable = netWealth * 0.025; // Estimate even if metal rate isn't set
                }
            }

            // UI Render
            document.getElementById('summaryGross').innerText = formatNum(grossWealth);
            document.getElementById('summaryLiabilities').innerText = formatNum(liabilities);
            document.getElementById('summaryNet').innerText = formatNum(netWealth);
            document.getElementById('nisabThresholdVal').innerText = formatNum(nisabThreshold);
            document.getElementById('zakatPayableDisplay').innerText = formatNum(zakatPayable);
        }

        // Helper: Number Formatter with commas
        function formatNum(num) {
            return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        // Download only the current calculation result as a PDF.
        function downloadZakatPdf() {
            const rows = [
                ['ZAKAT SUMMARY', ''],
                ['Total Gross Assets', currencySymbol + document.getElementById('summaryGross').innerText],
                ['Deductible Debts', '- ' + currencySymbol + document.getElementById('summaryLiabilities').innerText],
                ['Net Zakatable Wealth', currencySymbol + document.getElementById('summaryNet').innerText],
                ['Active Nisab (' + document.getElementById('nisabTypeDisplay').innerText + ')', currencySymbol + document.getElementById('nisabThresholdVal').innerText],
                ['Benchmark', document.getElementById('nisabBenchmarkText').innerText],
                ['Estimated Zakat Payable', currencySymbol + document.getElementById('zakatPayableDisplay').innerText],
                ['Rate', '2.5% (1/40th)']
            ];

            const escapePdfText = (value) => String(value).replace(/([\\()])/g, '\\$1');
            const lines = rows.map((row, index) => {
                const y = 760 - (index * 42);
                const fontSize = index === 0 ? 18 : index === 6 ? 16 : 11;
                const font = index === 0 || index === 6 ? '/F2' : '/F1';
                return 'BT ' + font + ' ' + fontSize + ' Tf 50 ' + y + ' Td (' + escapePdfText(row[0] + (row[1] ? ': ' + row[1] : '')) + ') Tj ET';
            }).join('\n');

            const objects = [
                '<< /Type /Catalog /Pages 2 0 R >>',
                '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
                '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
                '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
                '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>',
                '<< /Length ' + lines.length + ' >>\nstream\n' + lines + '\nendstream'
            ];
            let pdf = '%PDF-1.4\n';
            const offsets = [0];
            objects.forEach((object, index) => {
                offsets[index + 1] = pdf.length;
                pdf += (index + 1) + ' 0 obj\n' + object + '\nendobj\n';
            });
            const xrefOffset = pdf.length;
            pdf += 'xref\n0 ' + (objects.length + 1) + '\n0000000000 65535 f \n';
            offsets.slice(1).forEach((offset) => { pdf += String(offset).padStart(10, '0') + ' 00000 n \n'; });
            pdf += 'trailer\n<< /Size ' + (objects.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF';

            const blob = new Blob([pdf], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'zakat-summary.pdf';
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        }

        // Reset All Form Fields
        function resetCalculator() {
            document.querySelectorAll('input[type="number"]').forEach((input) => { input.value = ''; });
            calculateZakat();
        }
    </script>
